name: Effort Probe

# One model at non-scheduled effort levels; run_benchmark.py tags the results
# so they never touch latest.json or the verdict.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id to benchmark
        type: string
        default: claude-opus-5-5
      efforts:
        description: 'JSON array of effort levels, run one after another, e.g. ["medium","xhigh","max"]'
        type: string
        default: '["xhigh"]'
      repeats:
        description: Back-to-back runs per effort level (each gets its own run_id)
        type: number
        default: 1

# Shared with benchmark.yml so two jobs never race to push docs/data/.
concurrency:
  group: benchmark-data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # Per effort level; results are committed after every run, so a timeout loses one run at most.
    timeout-minutes: 345
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        effort: ${{ fromJSON(inputs.efforts) }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        env:
          CLAUDE_ALLOW_ROOT: "1"

      - name: Verify Claude Code
        run: claude --version

      - name: Install Python dependencies
        run: pip install evalplus

      - name: Generate task workspaces
        run: python bench/generate_tasks.py

      - name: Run probe, committing after each run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_EFFORT: ${{ matrix.effort }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$REPEATS"); do
            echo "::group::$BENCH_MODEL @ $BENCH_EFFORT, run $i of $REPEATS"
            # Pick up history.json rows pushed by earlier runs; autostash because
            # generate_tasks.py rewrites the tracked dataset file.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            BENCH_RUN_ID="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())')" \
              python bench/run_benchmark.py
            git add docs/data/
            git diff --staged --quiet || git commit -m "Add effort probe results: $BENCH_MODEL @ $BENCH_EFFORT ($i/$REPEATS)"
            git push
            echo "::endgroup::"
          done
